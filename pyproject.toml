[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mechdesign-agent"
dynamic = ["version"]
description = "Interactive engineering tool for exploring rectangular cantilever sensor-mount designs, with a deterministic mechanics engine, FE cross-checks and an optional LLM assistant."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
authors = [{ name = "MechDesign Agent contributors" }]
keywords = ["engineering", "cantilever", "beam", "mechanics", "design-exploration", "finite-element", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
# Natural-language interpretation via the Anthropic API (needs ANTHROPIC_API_KEY at runtime).
llm = ["anthropic>=2.9"]
# Independent open-source FE solver used for cross-checks. Note: anaStruct is GPL-3.0-or-later.
validation = ["anastruct>=1.6"]
dev = [
    "mechdesign-agent[llm,validation]",
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
]

[project.scripts]
mechdesign = "mechdesign.cli:main"

[tool.hatch.version]
path = "src/mechdesign/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mechdesign"]

[tool.hatch.build.targets.sdist]
# Source distribution: code, tests and docs only (no screenshots, CI files, launchers or local settings).
include = ["src", "tests", "docs", "examples", "validation", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "CHANGELOG.md"]
exclude = ["docs/images"]

# ---------------------------------------------------------------- tools

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["mechdesign"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E741",   # engineering notation: I (second moment of area), l (element length)
    "E501",   # long lines in data tables / messages are allowed; the formatter handles code
    "RUF001", # intentional unicode (Greek letters, ×) in user-facing strings
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.10"
files = ["src/mechdesign", "start.py"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
